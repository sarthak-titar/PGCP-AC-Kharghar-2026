<html>
    <head></head>
    <body>
        <button onclick="fetchUsersData()">Fetch Users Data</button>

        <table border="1" cellspacing="0" cellpadding="10">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody id="tbody">
                
            </tbody>
        </table>

        <script>
            async function fetchUsersData(){
                try {
                     const response = await fetch("https://jsonplaceholder.typicode.com/users");
                     console.log(response);
                     console.log(response.status);
                     const usersData = await response.json();
                     console.log(usersData);
                     
                     let tbody = document.getElementById("tbody");

                     for(var i=0; i<usersData.length; i++){
                        let row = document.createElement("tr");

                        let idColumn = document.createElement("td");
                        let nameColumn = document.createElement("td");
                        let usernameColumn = document.createElement("td");
                        let emailColumn = document.createElement("td");
                        let phoneColumn = document.createElement("td");

                        const {id, name, username, email, phone} = usersData[i];

                        idColumn.innerHTML = id;
                        nameColumn.innerHTML = name;
                        usernameColumn.innerHTML = username;
                        emailColumn.innerHTML = email;
                        phoneColumn.innerHTML = phone;

                        row.appendChild(idColumn);
                        row.appendChild(nameColumn);
                        row.appendChild(usernameColumn);
                        row.appendChild(emailColumn);
                        row.appendChild(phoneColumn);

                        tbody.appendChild(row);
                     }

                     
                } catch (error) {
                    console.log(error);
                    
                }
            }

         
            // const responsePromise = fetch("https://jsonplaceholder.typicode.com/users");
            // responsePromise
            // .then((response)=>{

            //     console.log(response.status);
            //     const data = response.json(); // gives the data which is in the response
            //     data.then((users)=>{
            //         console.log(users);
                    
            //     })
            // })
            // .catch((error)=>{
            //     console.log(error);
                
            // });
        </script>
    </body>
</html>
